services:
  pw-strength-api:
    build: .
    image: v01dst/pw-strength-api:1.0.0
    container_name: pw-strength-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
